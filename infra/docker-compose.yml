services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nekoanimes
      POSTGRES_USER: neko
      POSTGRES_PASSWORD: neko
    ports:
      - "5432:5432"
    volumes:
      - neko_postgres:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - neko_redis:/data

volumes:
  neko_postgres:
  neko_redis:
