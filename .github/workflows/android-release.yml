name: Android Release

on:
  workflow_dispatch:

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.4.1'
          cache-provider: basic

      - name: Restore release keystore
        env:
          NEKO_RELEASE_KEYSTORE_BASE64: ${{ secrets.NEKO_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$NEKO_RELEASE_KEYSTORE_BASE64"
          echo "$NEKO_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/neko-release.jks"

      - name: Build signed APK and AAB
        env:
          NEKO_RELEASE_STORE_FILE: ${{ runner.temp }}/neko-release.jks
          NEKO_RELEASE_STORE_PASSWORD: ${{ secrets.NEKO_RELEASE_STORE_PASSWORD }}
          NEKO_RELEASE_KEY_ALIAS: ${{ secrets.NEKO_RELEASE_KEY_ALIAS }}
          NEKO_RELEASE_KEY_PASSWORD: ${{ secrets.NEKO_RELEASE_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_MAX_SDK_KEY: ${{ secrets.MAX_SDK_KEY }}
          ORG_GRADLE_PROJECT_MAX_BANNER_AD_UNIT_ID: ${{ secrets.MAX_BANNER_AD_UNIT_ID }}
          ORG_GRADLE_PROJECT_MAX_APP_OPEN_AD_UNIT_ID: ${{ secrets.MAX_APP_OPEN_AD_UNIT_ID }}
          ORG_GRADLE_PROJECT_MAX_INTERSTITIAL_AD_UNIT_ID: ${{ secrets.MAX_INTERSTITIAL_AD_UNIT_ID }}
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: nekoanimes-release-apk
          path: apps/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: nekoanimes-release-aab
          path: apps/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
