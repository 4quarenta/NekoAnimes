name: Android CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-ci.yml'

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/android

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.4.1'
          cache-provider: basic

      - name: Configure Firebase for the Android build
        env:
          FIREBASE_JSON_B64: ${{ secrets.NEKOANIMES_FIREBASE_JSON_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_JSON_B64" ]; then
            echo '::error::Configure NEKOANIMES_FIREBASE_JSON_B64 for the NekoAnimes Firebase project.'
            exit 1
          fi
          printf '%s' "$FIREBASE_JSON_B64" | base64 --decode > app/google-services.json
          test -s app/google-services.json

      - name: Build direct debug APK
        run: gradle --no-daemon :app:assembleDirectDebug

      - name: Upload direct debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nekoanimes-direct-debug-apk
          path: apps/android/app/build/outputs/apk/direct/debug/app-direct-debug.apk
          if-no-files-found: error
