name: Deploy web staging

on:
  workflow_dispatch:

concurrency:
  group: neko-web-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VITE_API_BASE_URL: ${{ vars.NEKO_API_BASE_URL || 'https://nekoanimes-api-staging.john-alleff01.workers.dev' }}
      VITE_APP_VERSION: 1.0.37
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Validate staging configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VITE_API_BASE_URL"
      - name: Build web staging
        run: npm run build:web
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name nekoanimes-staging --branch main
