name: Deploy API staging

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/api-worker/**'
      - 'apps/api/src/database/schema/**'
      - 'apps/api/drizzle/**'
      - 'package.json'
      - '.github/workflows/deploy-api-staging.yml'

concurrency:
  group: neko-api-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Configure Worker secrets
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.NEKO_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.NEKO_SUPABASE_PUBLISHABLE_KEY }}
          APK_URL: ${{ secrets.NEKO_ANDROID_APK_URL }}
          APK_SHA256: ${{ secrets.NEKO_ANDROID_APK_SHA256 }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"
          test -n "$APK_URL"
          test -n "$APK_SHA256"
          printf '%s' "$SUPABASE_URL" | npx wrangler secret put SUPABASE_URL --config apps/api-worker/wrangler.jsonc
          printf '%s' "$SUPABASE_KEY" | npx wrangler secret put SUPABASE_PUBLISHABLE_KEY --config apps/api-worker/wrangler.jsonc
          printf '%s' "$APK_URL" | npx wrangler secret put ANDROID_APK_URL --config apps/api-worker/wrangler.jsonc
          printf '%s' "$APK_SHA256" | npx wrangler secret put ANDROID_APK_SHA256 --config apps/api-worker/wrangler.jsonc
      - name: Validate Worker bundle
        run: npx wrangler deploy --config apps/api-worker/wrangler.jsonc --dry-run
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config apps/api-worker/wrangler.jsonc
