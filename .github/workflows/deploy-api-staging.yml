name: Deploy API staging

on:
  workflow_dispatch:

concurrency:
  group: neko-api-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Ensure persisted anime metadata columns
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          has_column() {
            local column="$1"
            local result
            result="$(npx wrangler d1 execute nekoanimes-staging-db --remote --config apps/api-worker/wrangler.jsonc --command "SELECT COUNT(*) AS count FROM pragma_table_info('anime') WHERE name = '$column';" --json | jq -r '.[0].results[0].count')"
            [[ "$result" == "1" ]]
          }
          if ! has_column image_url; then
            npx wrangler d1 execute nekoanimes-staging-db --remote --config apps/api-worker/wrangler.jsonc --command "ALTER TABLE anime ADD COLUMN image_url TEXT;"
          fi
          if ! has_column backdrop_url; then
            npx wrangler d1 execute nekoanimes-staging-db --remote --config apps/api-worker/wrangler.jsonc --command "ALTER TABLE anime ADD COLUMN backdrop_url TEXT;"
          fi
      - name: Configure Worker secrets
        shell: bash
        env:
          APK_URL: ${{ secrets.NEKO_ANDROID_APK_URL }}
          APK_SHA256: ${{ secrets.NEKO_ANDROID_APK_SHA256 }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -n "$APK_URL" && -n "$APK_SHA256" ]]; then
            printf '%s' "$APK_URL" | npx wrangler secret put ANDROID_APK_URL --config apps/api-worker/wrangler.jsonc
            printf '%s' "$APK_SHA256" | npx wrangler secret put ANDROID_APK_SHA256 --config apps/api-worker/wrangler.jsonc
          fi
      - name: Validate Worker bundle
        run: npx wrangler deploy --config apps/api-worker/wrangler.jsonc --dry-run
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config apps/api-worker/wrangler.jsonc
